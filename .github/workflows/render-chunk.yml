name: Render Video Chunk
run-name: Render ${{ inputs.job_id }} chunk ${{ inputs.chunk_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Render job ID'
        required: true
        type: string
      chunk_id:
        description: 'Chunk ID'
        required: true
        type: string
      variation_id:
        description: 'Variation ID'
        required: true
        type: string
      props_url:
        description: 'Props JSON URL'
        required: true
        type: string
      start_frame:
        description: 'Start frame'
        required: true
        type: string
      end_frame:
        description: 'End frame'
        required: true
        type: string

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Download props
        run: |
          echo "Downloading props from ${{ inputs.props_url }}"
          curl -L \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/octet-stream" \
            -o props.json \
            "${{ inputs.props_url }}"
          echo "Props:"
          cat props.json | jq .

      - name: Download assets
        run: |
          VIDEO_URL=$(cat props.json | jq -r '.videoSrc')
          AUDIO_URL=$(cat props.json | jq -r '.audioSrc // empty')

          if [ -z "$VIDEO_URL" ] || [ "$VIDEO_URL" = "null" ]; then
            echo "videoSrc is empty; rendering composition without a base video"
          elif [[ "$VIDEO_URL" == data:* ]]; then
            echo "videoSrc is a data URI; Remotion will read it directly from props"
          else
            echo "Downloading video: $VIDEO_URL"
            curl -L -o input-video.mp4 "$VIDEO_URL"
          fi

          if [ ! -z "$AUDIO_URL" ] && [ "$AUDIO_URL" != "null" ]; then
            if [[ "$AUDIO_URL" == data:* ]]; then
              echo "audioSrc is a data URI; Remotion will read it directly from props"
            else
              echo "Downloading audio: $AUDIO_URL"
              curl -L -o input-audio.mp3 "$AUDIO_URL"
            fi
          fi

          ls -lh input-* 2>/dev/null || true

      - name: Render chunk with Remotion
        run: |
          echo "Rendering chunk ${{ inputs.chunk_id }}"
          echo "Frames: ${{ inputs.start_frame }} - ${{ inputs.end_frame }}"

          bunx remotion render \
            src/remotion/index.tsx \
            VideoComposition \
            chunk-${{ inputs.chunk_id }}.mp4 \
            --props=props.json \
            --frames=${{ inputs.start_frame }}-${{ inputs.end_frame }} \
            --codec=h264 \
            --crf=18 \
            --concurrency=4 \
            --log=verbose

          if [ ! -f "chunk-${{ inputs.chunk_id }}.mp4" ]; then
            echo "Render failed: output file not found"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "chunk-${{ inputs.chunk_id }}.mp4")
          echo "Chunk rendered: $(echo $FILE_SIZE | awk '{print $1/1024/1024 "MB"}')"

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ inputs.chunk_id }}
          path: chunk-${{ inputs.chunk_id }}.mp4
          retention-days: 7
          compression-level: 0
